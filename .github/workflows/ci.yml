name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iOS app (uses macOS runner minutes)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}" scripts/*.mjs proxy.conf.mjs
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Release image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: >
          docker buildx build --platform linux/amd64 --load
          --build-arg VERSION=ci-${{ github.sha }}
          -t madar-web:ci .
      - name: Smoke test
        run: |
          docker run -d --name madar -p 8080:80 \
            -e ERPNEXT_UPSTREAM=http://erpnext.invalid \
            -e MADAR_ERPNEXT_URL=https://erp.example.com \
            madar-web:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz | grep -q ok
          curl -sf localhost:8080/version.txt | grep -q "ci-${{ github.sha }}"
          curl -sf localhost:8080/config.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["erpnextUrl"] == "https://erp.example.com"'
          curl -sfI localhost:8080/ | grep -qi '^x-content-type-options: nosniff'
          curl -sf localhost:8080/sales | grep -q '<app-root>'
      - name: Container logs
        if: failure()
        run: docker logs madar

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Sync web build into the native project
        run: npm run cap:sync:dev
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS simulator build
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync web build into the native project
        run: npm run cap:sync:dev
      - name: Build for the simulator
        working-directory: ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO
